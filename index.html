<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TLL Repaired Animation Viewer</title><style>body{background:#101826;color:#e9f3ff;font:16px system-ui;padding:2rem;max-width:650px;margin:auto}progress{width:100%}</style></head><body><h1>🦴 TLL Animation Viewer</h1><p id="status">Loading the original artwork and animation rigs…</p><progress id="progress" max="25" value="0"></progress><script>(async()=>{try{const urls=Array.from({length:25},(_,i)=>"tll/parts/part-"+String(i).padStart(3,"0")+".txt");const chunks=[];for(let i=0;i<urls.length;i++){const response=await fetch(urls[i]);if(!response.ok)throw new Error(urls[i]+": HTTP "+response.status);chunks.push(await response.text());document.getElementById("progress").value=i+1;document.getElementById("status").textContent="Loading animation data: "+(i+1)+"/25";}const html=chunks.join("");document.open();document.write(html);document.close();}catch(e){document.getElementById("status").textContent="Couldn't load viewer: "+e.message;console.error(e);}})();</script></body></html>
